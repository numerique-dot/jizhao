<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="JiZhao AI Photo d’identité — 拍一张，剩下交给 AI。" />
  <title>JiZhao · AI 证件照</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="JiZhao 首页">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-word">JiZhao</span>
      </a>

      <div class="topbar-actions">
        <button class="country-pill" id="countryBtn" type="button" aria-haspopup="dialog">
          <span id="countryFlag">🇫🇷</span>
          <span id="countryName">France</span>
          <span aria-hidden="true">⌄</span>
        </button>
        <button class="language-switch" id="langBtn" type="button">FR</button>
      </div>
    </header>

    <main id="app" class="main" aria-live="polite"></main>

    <footer class="site-footer">
      <div class="trust-row">
        <span>✓ <span data-i18n="trust.ai">AI 自动处理</span></span>
        <span>✓ <span data-i18n="trust.privacy">隐私优先</span></span>
        <span>✓ <span data-i18n="trust.fast">快速生成</span></span>
      </div>
      <div class="footer-links">
        <button class="text-link" data-modal="privacy" type="button" data-i18n="footer.privacy">隐私</button>
        <button class="text-link" data-modal="help" type="button" data-i18n="footer.help">帮助</button>
        <span>© 2026 JiZhao</span>
      </div>
    </footer>
  </div>

  <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />

  <dialog id="countryDialog" class="dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" data-i18n="country.label">国家 / 地区</p>
          <h2 data-i18n="country.title">选择证件照标准</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog aria-label="关闭">×</button>
      </div>
      <div class="country-grid" id="countryGrid"></div>
      <p class="dialog-note" data-i18n="country.note">尺寸、背景和人脸比例由系统自动处理，不需要手动设置。</p>
    </div>
  </dialog>

  <dialog id="infoDialog" class="dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <h2 id="infoTitle"></h2>
        <button class="icon-btn" type="button" data-close-info aria-label="关闭">×</button>
      </div>
      <div id="infoBody" class="info-body"></div>
    </div>
  </dialog>

  <script src="./app.js" defer></script>
</body>
</html>
